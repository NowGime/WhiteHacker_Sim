46\u044B",q:2},{label:"\u0417\u0430\u0445\u043E\u0436\u0443 \u0432 \u0441\u0432\u043E\u0439 \u0430\u043A\u043A\u0430\u0443\u043D\u0442 \u0447\u0435\u0440\u0435\u0437 \u0437\u0430\u043A\u043B\u0430\u0434\u043A\u0443 \u0438\u043B\u0438 \u043F\u0440\u0438\u043B\u043E\u0436\u0435\u043D\u0438\u0435",q:3}],why:"\u041B\u043E\u0433\u043E\u0442\u0438\u043F \u0438 \u0430\u043A\u043A\u0443\u0440\u0430\u0442\u043D\u044B\u0439 \u0442\u0435\u043A\u0441\u0442 \u043B\u0435\u0433\u043A\u043E \u043F\u043E\u0434\u0434\u0435\u043B\u0430\u0442\u044C, \u0430 \u0430\u0434\u0440\u0435\u0441 \u0432 \u0441\u0441\u044B\u043B\u043A\u0435 \u043C\u043E\u0436\u043D\u043E \u0441\u0434\u0435\u043B\u0430\u0442\u044C \u043E\u0447\u0435\u043D\u044C \u043F\u043E\u0445\u043E\u0436\u0438\u043C \u043D\u0430 \u043D\u0430\u0441\u0442\u043E\u044F\u0449\u0438\u0439. \u041D\u0430\u0434\u0451\u0436\u043D\u0435\u0435 \u0432\u0441\u0435\u0433\u043E \u043D\u0435 \u0434\u043E\u0432\u0435\u0440\u044F\u0442\u044C \u0441\u0441\u044B\u043B\u043A\u0435 \u0438 \u0437\u0430\u0439\u0442\u0438 \u0432 \u0430\u043A\u043A\u0430\u0443\u043D\u0442 \u0441\u0430\u043C\u043E\u043C\u0443.",tip:"\u0415\u0441\u043B\u0438 \u043F\u0438\u0441\u044C\u043C\u043E \u0442\u043E\u0440\u043E\u043F\u0438\u0442 \u0447\u0442\u043E-\u0442\u043E \u0441\u0434\u0435\u043B\u0430\u0442\u044C \u0441\u0440\u043E\u0447\u043D\u043E, \u0437\u0430\u043A\u0440\u043E\u0439 \u0435\u0433\u043E \u0438 \u0437\u0430\u0439\u0434\u0438 \u0432 \u0441\u0432\u043E\u0439 \u0430\u043A\u043A\u0430\u0443\u043D\u0442 \u043D\u0430\u043F\u0440\u044F\u043C\u0443\u044E. \u041D\u0430\u0441\u0442\u043E\u044F\u0449\u0435\u0435 \u0442\u0440\u0435\u0431\u043E\u0432\u0430\u043D\u0438\u0435 \u0431\u0443\u0434\u0435\u0442 \u0432\u0438\u0434\u043D\u043E \u0438 \u0442\u0430\u043C.",fast:"\u042F \u0431\u044B \u043E\u0442\u043F\u0440\u0430\u0432\u0438\u043B \u043F\u0438\u0441\u044C\u043C\u043E \xAB\u043E\u0442 \u0431\u0430\u043D\u043A\u0430\xBB \u0441\u043E \u0441\u0440\u043E\u0447\u043D\u044B\u043C \u0442\u0440\u0435\u0431\u043E\u0432\u0430\u043D\u0438\u0435\u043C \u0438 \u0441\u0441\u044B\u043B\u043A\u043E\u0439 \u043D\u0430 \u043A\u043E\u043F\u0438\u044E \u0441\u0442\u0440\u0430\u043D\u0438\u0446\u044B \u0432\u0445\u043E\u0434\u0430. \u0421\u0442\u0440\u0430\u0445 \u043F\u043E\u0442\u0435\u0440\u044F\u0442\u044C \u0434\u0435\u043D\u044C\u0433\u0438 \u0437\u0430\u0441\u0442\u0430\u0432\u043B\u044F\u0435\u0442 \u043B\u044E\u0434\u0435\u0439 \u0434\u0435\u0439\u0441\u0442\u0432\u043E\u0432\u0430\u0442\u044C \u0431\u044B\u0441\u0442\u0440\u0435\u0435, \u0447\u0435\u043C \u043E\u043D\u0438 \u0434\u0443\u043C\u0430\u044E\u0442.",stealth:"\u042F \u0431\u044B \u0437\u0430\u0440\u0435\u0433\u0438\u0441\u0442\u0440\u0438\u0440\u043E\u0432\u0430\u043B \u0430\u0434\u0440\u0435\u0441, \u043E\u0442\u043B\u0438\u0447\u0430\u044E\u0449\u0438\u0439\u0441\u044F \u043E\u0442 \u043D\u0430\u0441\u0442\u043E\u044F\u0449\u0435\u0433\u043E \u043E\u0434\u043D\u043E\u0439 \u0431\u0443\u043A\u0432\u043E\u0439, \u0438 \u043E\u0442\u043F\u0440\u0430\u0432\u043B\u044F\u043B \u043F\u0438\u0441\u044C\u043C\u0430 \u0432 \u0440\u0430\u0431\u043E\u0447\u0435\u0435 \u0432\u0440\u0435\u043C\u044F, \u043A\u043E\u0433\u0434\u0430 \u0442\u0430\u043A\u0438\u0435 \u0440\u0430\u0441\u0441\u044B\u043B\u043A\u0438 \u043F\u0440\u0438\u0432\u044B\u0447\u043D\u044B. \u0420\u0430\u0437\u043D\u0438\u0446\u0443 \u0432 \u043E\u0434\u043D\u0443 \u0431\u0443\u043A\u0432\u0443 \u043B\u0435\u0433\u043A\u043E \u043D\u0435 \u0437\u0430\u043C\u0435\u0442\u0438\u0442\u044C."},hacker:{question:"\u0422\u0435\u0431\u0435 \u043F\u0440\u0438\u0448\u043B\u0430 \u0441\u0441\u044B\u043B\u043A\u0430 \u0432\u0438\u0434\u0430, \u043F\u043E\u043A\u0430\u0437\u0430\u043D\u043D\u043E\u0433\u043E \u043D\u0438\u0436\u0435, \u0441\u043E \u0441\u043B\u043E\u0432\u0430\u043C\u0438 \xAB\u043F\u043E\u0434\u0442\u0432\u0435\u0440\u0434\u0438\u0442\u0435 \u0432\u0445\u043E\u0434\xBB. \u041A\u0430\u043A \u0442\u044B \u043E\u043F\u0 42\u0440\u043E\u0439\u0441\u0442\u0432\u043E \u043E\u043A\u0430\u0436\u0435\u0442\u0441\u044F \u0431\u0435\u0437 \u043F\u0440\u0438\u0441\u043C\u043E\u0442\u0440\u0430. \u0414\u043E \u044D\u0442\u043E\u0433\u043E \u0442\u044B \u043D\u0438\u0447\u0435\u0433\u043E \u043D\u0435 \u0437\u0430\u043F\u043E\u0434\u043E\u0437\u0440\u0438\u0448\u044C."},pro:{question:"\u0427\u0442\u043E \u0442\u044B \u0434\u0435\u043B\u0430\u0435\u0448\u044C, \u043A\u043E\u0433\u0434\u0430 \u0440\u0430\u0431\u043E\u0442\u0430\u0435\u0448\u044C \u0441 \u043A\u043E\u043D\u0444\u0438\u0434\u0435\u043D\u0446\u0438\u0430\u043B\u044C\u043D\u044B\u043C\u0438 \u0434\u0430\u043D\u043D\u044B\u043C\u0438 \u0432 \u043E\u0431\u0449\u0435\u0441\u0442\u0432\u0435\u043D\u043D\u043E\u043C \u043C\u0435\u0441\u0442\u0435?",options:[{label:"\u0420\u0430\u0431\u043E\u0442\u0430\u044E \u043A\u0430\u043A \u043E\u0431\u044B\u0447\u043D\u043E: \u043D\u0438\u043A\u0442\u043E \u043D\u0435 \u0441\u043C\u043E\u0442\u0440\u0438\u0442, \u0430 \u0437\u0432\u043E\u043D\u043A\u0438 \u043F\u043E \u0434\u0435\u043B\u0443 \u0432\u0435\u0434\u0443 \u0432\u0441\u043B\u0443\u0445",q:0},{label:"\u0421\u0430\u0436\u0443\u0441\u044C \u0441\u043F\u0438\u043D\u043E\u0439 \u043A \u0441\u0442\u0435\u043D\u0435, \u043D\u043E \u0437\u0432\u043E\u043D\u043A\u0438 \u0432\u0435\u0434\u0443 \u0432\u0441\u043B\u0443\u0445 \u0438 \u0437\u0430\u0440\u044F\u0436\u0430\u044E\u0441\u044C \u0433\u0434\u0435 \u043F\u0440\u0438\u0434\u0451\u0442\u0441\u044F",q:1},{label:"\u041F\u043B\u0451\u043D\u043A\u0430 \u043F\u0440\u0438\u0432\u0430\u0442\u043D\u043E\u0441\u0442\u0438 \u0438 \u0441\u0432\u043E\u0439 \u043A\u0430\u0431\u0435\u043B\u044C, \u043D\u043E \u0431\u043B\u043E\u043A\u0438\u0440\u043E\u0432\u043A\u0443 \u043F\u0440\u0438 \u0443\u0445\u043E\u0434\u0435 \u0432\u043A\u043B\u044E\u0447\u0430\u044E \u043D\u0435 \u0432\u0441\u0435\u0433\u0434\u0430",q:2},{label:"\u041F\u043B\u0451\u043D\u043A\u0430, \u0431\u043B\u043E\u043A\u0438\u0440\u043E\u0432\u043A\u0430 \u043F\u0440\u0438 \u043A\u0430\u0436\u0434\u043E\u043C \u0443\u0445\u043E\u0434\u0435, \u0441\u0432\u043E\u0439 \u0430\u0434\u0430\u043F\u0442\u0435\u0440, \u0437\u0432\u043E\u043D\u043A\u0438 \u043E\u0442\u043A\u043B\u0430\u0434\u044B\u0432\u0430\u044E",q:3}],why:"\u0412 \u043E\u0431\u0449\u0435\u0441\u0442\u0432\u0435\u043D\u043D\u044B\u0445 \u043C\u0435\u0441\u0442\u0430\u0445 \u0447\u0430\u0449\u0435 \u0432\u0441\u0435\u0433\u043E \u0441\u0442\u0440\u0430\u0434\u0430\u0435\u0442 \u043D\u0435 \u0442\u0435\u0445\u043D\u0438\u043A\u0430, \u0430 \u043F\u0440\u0438\u0432\u044B\u0447\u043A\u0438: \u043F\u043E\u0434\u0441\u043C\u043E\u0442\u0440\u0435\u043D\u043D\u044B\u0439 \u044D\u043A\u0440\u0430\u043D, \u043F\u043E\u0434\u0441\u043B\u0443\u0448\u0430\u043D\u043D\u044B\u0439 \u0440\u0430\u0437\u0433\u043E\u0432\u043E\u0440, \u043D\u043E\u0443\u0442\u0431\u0443\u043A \u0431\u0435\u0437 \u0431\u043B\u043E\u043A\u0438\u0440\u043E\u0432\u043A\u0438. \u041F\u043B\u0451\u043D\u043A\u0430 \u0438 \u0431\u043B\u043E\u043A\u0438\u0440\u043E\u0432\u043A\u0430 \u043F\u0440\u043E\u0441\u0442\u044B\u0435, \u043D\u043E \u0437\u0430\u043A\u0440\u044B\u0432\u0430\u044E\u0442 \u0441\u0430\u043C\u043E\u0435 \u0447\u0430\u0441\u0442\u043E\u0435.",tip:"\u0411\u043B\u043E\u043A\u0438\u0440\u0443\u0439 \u044D\u043A\u0440\u0430\u043D \u043A\u0430\u0436\u0434\u044B\u0439 \u0440\u0430\u0437, \u043A\u043E\u0433\u0434\u0430 \u0432\u0441\u0442\u0430\u0451\u0448\u044C, \u043F\u043E\u043B\u044C\u0437\u0443\u0439\u0441\u044F \u0441\u0432\u043E\u0438\u043C \u0430\u0434\u0430\u043F\u0442\u0435\u0440\u043E\u043C \u0438 \u043A\u0430\u0431\u0435\u043B\u0435\u043C \u0438 \u043D\u0435 \u043E\u0431\u0441\u0443\u0436\u0434\u0430\u0439 \u0440\u0430\u0431\u043E\u0447\u0435\u0435 \u0432\u0441\u043B\u0443\u0445. \u0414\u043B\u044F \u043D\u043E\u0443\u0442\u0431\u0443\u043A\u0430 \u043F\u043E\u0441\u0442\u0430\u0432\u044C \u043F\u043B\u0451\u043D\u043A\u0443 \u043F\u0440\u0438\u0432\u0430\u0442\u0 43B\u044C, \u0437\u0430\u043A\u0440\u044B\u0432\u0430\u044E \u043B\u0438\u0448\u043D\u0435\u0435, \u0441\u0442\u0430\u0432\u043B\u044E \u043F\u043E\u043C\u0435\u0442\u043A\u0443, \u0447\u0438\u0449\u0443 \u0447\u0430\u0442",q:3}],why:"\u0424\u043E\u0442\u043E \u0434\u043E\u043A\u0443\u043C\u0435\u043D\u0442\u0430 \u0432 \u0447\u0443\u0436\u043E\u043C \u0447\u0430\u0442\u0435 \u043C\u043E\u0436\u0435\u0442 \u0443\u0442\u0435\u0447\u044C \u0432\u043C\u0435\u0441\u0442\u0435 \u0441 \u0442\u0435\u043C, \u0443 \u043A\u043E\u0433\u043E \u043E\u043D\u043E \u0445\u0440\u0430\u043D\u0438\u0442\u0441\u044F. \u041F\u043E\u043C\u0435\u0442\u043A\u0430 \u0441 \u0446\u0435\u043B\u044C\u044E \u0438 \u0434\u0430\u0442\u043E\u0439 \u043C\u0435\u0448\u0430\u0435\u0442 \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u044C \u0441\u043D\u0438\u043C\u043E\u043A \u0434\u043B\u044F \u0434\u0440\u0443\u0433\u043E\u0433\u043E \u043E\u0444\u043E\u0440\u043C\u043B\u0435\u043D\u0438\u044F, \u0430 \u043B\u0438\u0448\u043D\u0438\u0435 \u0434\u0430\u043D\u043D\u044B\u0435 \u0442\u044B \u043F\u0440\u043E\u0441\u0442\u043E \u043D\u0435 \u043E\u0442\u0434\u0430\u0451\u0448\u044C.",tip:"\u041F\u0435\u0440\u0435\u0434 \u043E\u0442\u043F\u0440\u0430\u0432\u043A\u043E\u0439 \u0434\u043E\u043A\u0443\u043C\u0435\u043D\u0442\u0430 \u0443\u0437\u043D\u0430\u0439, \u0437\u0430\u0447\u0435\u043C \u043E\u043D \u043D\u0443\u0436\u0435\u043D, \u0437\u0430\u043A\u0440\u043E\u0439 \u043B\u0438\u0448\u043D\u0438\u0435 \u0434\u0430\u043D\u043D\u044B\u0435 \u0438 \u043D\u0430\u043F\u0438\u0448\u0438 \u043D\u0430 \u043A\u043E\u043F\u0438\u0438, \u043A\u043E\u043C\u0443 \u0438 \u0434\u043B\u044F \u0447\u0435\u0433\u043E \u043E\u043D\u0430. \u0423\u0434\u0430\u043B\u0438 \u043E\u0442\u043F\u0440\u0430\u0432\u043B\u0435\u043D\u043D\u044B\u0435 \u0444\u0430\u0439\u043B\u044B \u0438\u0437 \u0447\u0430\u0442\u0430, \u043A\u043E\u0433\u0434\u0430 \u043E\u043D\u0438 \u043F\u0435\u0440\u0435\u0441\u0442\u0430\u043D\u0443\u0442 \u0431\u044B\u0442\u044C \u043D\u0443\u0436\u043D\u044B.",fast:"\u042F \u0431\u044B \u0432\u044B\u0434\u0430\u043B \u0441\u0435\u0431\u044F \u0437\u0430 \u0430\u0440\u0435\u043D\u0434\u043E\u0434\u0430\u0442\u0435\u043B\u044F \u0438\u043B\u0438 \u0441\u043E\u0442\u0440\u0443\u0434\u043D\u0438\u043A\u0430 \u0441\u0435\u0440\u0432\u0438\u0441\u0430 \u0438 \u043F\u043E\u043F\u0440\u043E\u0441\u0438\u043B \u043F\u0440\u0438\u0441\u043B\u0430\u0442\u044C \u0434\u043E\u043A\u0443\u043C\u0435\u043D\u0442\u044B \xAB\u0434\u043B\u044F \u043E\u0444\u043E\u0440\u043C\u043B\u0435\u043D\u0438\u044F\xBB. \u041C\u043D\u043E\u0433\u0438\u0435 \u043E\u0442\u043F\u0440\u0430\u0432\u043B\u044F\u044E\u0442 \u0441\u0440\u0430\u0437\u0443, \u043D\u0435 \u043F\u0440\u043E\u0432\u0435\u0440\u044F\u044F, \u043A\u0442\u043E \u043F\u0440\u043E\u0441\u0438\u0442.",stealth:"\u042F \u0431\u044B \u0431\u0440\u0430\u043B \u0433\u043E\u0442\u043E\u0432\u044B\u0435 \u0441\u043A\u0430\u043D\u044B \u0438\u0437 \u0434\u0430\u0432\u043D\u043E \u0437\u0430\u0431\u044B\u0442\u043E\u0439 \u043F\u0435\u0440\u0435\u043F\u0438\u0441\u043A\u0438 \u0438\u043B\u0438 \u0430\u0440\u0445\u0438\u0432\u0430 \u0447\u0430\u0442\u0430. \u041E\u043D\u0438 \u043B\u0435\u0436\u0430\u0442 \u0442\u0430\u043C \u0433\u043E\u0434\u0430\u043C\u0438, \u0438 \u0442\u044B \u043D\u0435 \u0443\u0437\u043D\u0430\u0435\u0448\u044C \u043E\u0431 \u0443\u0442\u0435\u0447\u043A\u0435, \u043F\u043E\u043A\u0430 \u043D\u0435 \u043F\u0440\u0438\u0434\u0451\u0442 \u0447\u0443\u0436\u043E\u0439 \u0434\u043E\u043B\u0433."},hacker:{question:"\u041A\u0430\u043A \u0442\u044B \u0445\u0440\u0430\u043D\u0438\u0448\u044C \u0438 \u043F\u0435\u0440\u0435\u0434\u0430\u0451\u0448\u044C \u0441\u043A\u0430\u043D\u044B \u0434\u043E\u043A\u0443\u043C\u0435\u043D\u0442\u043E\u0432 \u0441 \u0443\u0447\u0451\u0442\u043E\u043C \u043C\u0435\u0442\u0430\u0434\u0430\u043D\u043D\u044B\u0445, \u0440\u0435\u0437\u0435\u0440\u0432\u043D\u044B\u0445 \u04
